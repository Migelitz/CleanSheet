[project]
name = "CleanSheet"
version = "1.0.0"
description = "One Click, Data Clean!"
readme = "README.md"
authors = [
    { name = "Migelitz", email = "macalla.chyrusmiguel@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "nuitka>=4.2",
    "openpyxl>=3.1.5",
    "pandas>=3.0.5",
    "python-calamine>=0.8.2",
    "pillow>=12.3.0",
    "tkinterdnd2>=0.6.2",
    "xlrd>=2.0.2",
    "numpy>=2.5.2",
    "nameparser>=2.2.0",
    "xlsxwriter>=3.2.9",
    "requests>=2.34.2",
]

[project.scripts]
cleansheet = "cleansheet.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cleansheet"]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "nuitka>=4.2",
    "psutil>=7.2.2",
    "pygame>=2.6.1",
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.3",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # Pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
skip-magic-trailing-comma = false
docstring-code-format = true