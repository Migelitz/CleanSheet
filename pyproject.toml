[project]
name = "data-handling"
version = "0.1.0"
description = "One Click, Data Clean!"
readme = "README.md"
authors = [
    { name = "Migelitz", email = "macalla.chyrusmiguel@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "nuitka>=4.2",
    "openpyxl>=3.1.5",
    "pandas>=3.0.5",
    "python-calamine>=0.8.2",
    "pillow>=12.3.0",
    "tkinterdnd2>=0.6.2",
    "xlrd>=2.0.2",
    "numpy>=2.5.2",
    "nameparser>=2.2.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pyright>=1.1.411",
]
